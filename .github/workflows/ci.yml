name: CI

on:
  push:
    branches: [main]        # every push to main
  pull_request:             # every PR, to any branch

permissions:
  contents: read            # least privilege: CI can only READ the repo

concurrency:                # a new push cancels the still-running old run → saves time
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7          # get the repo's code onto the runner

      - uses: astral-sh/setup-uv@v10.3.0       # install uv (it reads .python-version for Python)
        with:
          enable-cache: true               # cache downloaded packages between runs

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run --all-packages pytest

  build-image:
    needs: lint-and-test                   # only runs if lint-and-test passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4   # Docker's modern builder (needed for caching)

      - name: Build generator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/generator/Dockerfile
          push: false                      # only prove it builds; we publish images in Phase 4
          tags: fraudguard-generator:ci
          cache-from: type=gha             # reuse layers from previous CI runs
          cache-to: type=gha,mode=max
  publish-scoring-api:
    needs: lint-and-test
    if: github.event_name == 'push'        # only on merges to main, never on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # allow pushing to GHCR
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      # built-in token, no secret to create

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fraudguard-scoring-api
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/scoring-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

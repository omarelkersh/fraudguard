[project]
name = "fraudguard-generator"
version = "0.1.0"
description = "Synthetic bank transaction generator that streams events to Kafka for FraudGuard"
readme = "README.md"
authors = [
    { name = "Omar Elkersh", email = "85870525+omarelkersh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
fraudguard-generator = "fraudguard_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

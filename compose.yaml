services:
  kafka:
    image: apache/kafka:4.3.1          # official image, pinned to the latest stable version
    ports:
      - "9092:9092"                    # "Mac port : container port" → reachable from your Mac
    environment:
      # --- KRaft mode: this one node is both broker AND controller (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners: INTERNAL for other containers, EXTERNAL for your Mac ---
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single node → internal topics can only have 1 copy (production uses 3) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data # messages survive container restarts
    healthcheck:                       # Compose checks every 10s whether Kafka really answers
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
  generator:
    build:
      context: .
      dockerfile: services/generator/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092        # Kafka's INTERNAL address (name:port)
      N_TRANSACTIONS: "1000"
    depends_on:
      kafka:
        condition: service_healthy        # wait until Kafka is really ready
  storage:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: fraudguard
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data

volumes:
  kafka-data:
  storage-data:

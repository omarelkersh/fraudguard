[project]
name = "fraudguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/*"]
exclude = ["services/streaming"]

[dependency-groups]
dbt = [
    "dbt-duckdb>=1.11.0",
]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
ml = [
    "duckdb>=1.5.6",
    "mlflow==3.17.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
